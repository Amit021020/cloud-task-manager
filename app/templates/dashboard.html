<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cloud Task Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">

                <div class="logo-icon">
                    ✓
                </div>

                <span>
                    Task Manager
                </span>

            </div>

            <nav>

                <a href="#" class="nav-item active">
                    <span>▣</span>
                    Dashboard
                </a>

            </nav>

            <div class="sidebar-bottom">

                <div class="user-mini">

                    <div class="avatar">
                        {{ username[0]|upper }}
                    </div>

                    <div>

                        <strong>
                            {{ username }}
                        </strong>

                        <small>
                            User
                        </small>

                    </div>

                </div>

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>

        </aside>


        <!-- Main content -->

        <main class="main-content">

            <header class="topbar">

                <div>

                    <h1>
                        Good to see you, {{ username }} 👋
                    </h1>

                    <p>
                        Here's what's happening with your tasks.
                    </p>

                </div>

            </header>


            <!-- Statistics -->

            <section class="stats-grid">

                <div class="stat-card">

                    <div class="stat-icon">
                        📋
                    </div>

                    <div>

                        <span>
                            Total Tasks
                        </span>

                        <strong id="totalTasks">
                            0
                        </strong>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        ⏳
                    </div>

                    <div>

                        <span>
                            Pending
                        </span>

                        <strong id="pendingTasks">
                            0
                        </strong>

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        ✓
                    </div>

                    <div>

                        <span>
                            Completed
                        </span>

                        <strong id="completedTasks">
                            0
                        </strong>

                    </div>

                </div>

            </section>


            <!-- Add task -->

            <section class="task-input-section">

                <form id="taskForm">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What do you need to accomplish?"
                        maxlength="200"
                        required
                    >

                    <button
                        type="submit"
                        class="add-btn"
                    >
                        + Add Task
                    </button>

                </form>

            </section>


            <!-- Tasks -->

            <section class="tasks-section">

                <div class="section-header">

                    <div>

                        <h2>
                            My Tasks
                        </h2>

                        <p>
                            Manage your daily activities.
                        </p>

                    </div>

                    <button
                        id="clearCompletedBtn"
                        class="clear-btn"
                    >
                        Clear Completed
                    </button>

                </div>

                <div id="taskList" class="task-list">

                    <div class="loading">
                        Loading tasks...
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- Toast notification -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
