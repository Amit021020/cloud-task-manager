<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cloud Task Manager - Register</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">

                <div class="logo-icon">
                    ✓
                </div>

                <h1>Create Account</h1>

            </div>

            <p class="subtitle">
                Start managing your tasks today.
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Choose a username"
                        minlength="3"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

                <div
                    id="registerMessage"
                    class="message"
                ></div>

            </form>

            <p class="auth-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
