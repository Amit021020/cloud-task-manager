apiVersion: v1
kind: Service

metadata:
  name: task-manager
  namespace: cloud-task-manager

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"

spec:
  selector:
    app: task-manager

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

  type: ClusterIP