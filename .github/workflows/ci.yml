name: Cloud Task Manager CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloud-task-manager
  EC2_INSTANCE_ID: i-0194bbec0d55e88a6

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300833114:role/cloud-task-manager-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:

    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300833114:role/cloud-task-manager-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin 536300833114.dkr.ecr.ap-south-1.amazonaws.com\",
              \"docker pull 536300833114.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-manager:$IMAGE_TAG\",
              \"docker rm -f cloud-task-manager || true\",
              \"SECRET_KEY=\$(aws secretsmanager get-secret-value --secret-id cloud-task-manager/secret-key --region $AWS_REGION --query SecretString --output text | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"SECRET_KEY\\\"])')\",
              \"docker run -d --name cloud-task-manager -p 5000:5000 -e SECRET_KEY=\\\"\\\$SECRET_KEY\\\" --restart unless-stopped 536300833114.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-manager:$IMAGE_TAG\"
            ]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Deployment completed successfully."