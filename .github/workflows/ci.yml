name: Cloud Task Manager CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::536300833114:role/cloud-task-manager-github-actions
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cloud-task-manager
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cloud-task-manager
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
      - name: Deploy to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0194bbec0d55e88a6 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 536300833114.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 536300833114.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-manager:latest",
              "docker rm -f cloud-task-manager || true",
              "SECRET_KEY=$(aws secretsmanager get-secret-value --secret-id cloud-task-manager/secret-key --region ap-south-1 --query SecretString --output text | python3 -c '\''import sys,json; print(json.load(sys.stdin)[\"SECRET_KEY\"])'\'' )",
              "docker run -d --name cloud-task-manager -p 5000:5000 -e SECRET_KEY=\"$SECRET_KEY\" --restart unless-stopped 536300833114.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-manager:latest"
            ]' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0194bbec0d55e88a6 \
            --region ap-south-1

          echo "Deployment completed successfully."