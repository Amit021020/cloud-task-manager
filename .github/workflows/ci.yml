name: Cloud Task Manager CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-and-push:

    name: Build and Push Docker Image

    runs-on: self-hosted

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cloud-task-manager:latest
            ${{ secrets.DOCKER_USERNAME }}/cloud-task-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:

    name: Deploy to Kubernetes

    needs: build-and-push

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version

      - name: Check kubectl
        run: |
          kubectl version --client

      - name: Check Kind
        run: |
          kind version
          kind get clusters

      - name: Check Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Namespace
        run: |
          kubectl apply -f k8s/namespace.yml

      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic task-manager-secret \
            --from-literal=SECRET_KEY=${{ secrets.SECRET_KEY }} \
            -n cloud-task-manager \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply \
            -f k8s/deployment.yml \
            -n cloud-task-manager

      - name: Apply Kubernetes Service
        run: |
          kubectl apply \
            -f k8s/service.yml \
            -n cloud-task-manager

      - name: Update Kubernetes Image
        run: |
          kubectl set image deployment/task-manager \
            task-manager=${{ secrets.DOCKER_USERNAME }}/cloud-task-manager:${{ github.sha }} \
            -n cloud-task-manager

      - name: Wait for Application
        run: |
          kubectl rollout status deployment/task-manager \
            -n cloud-task-manager \
            --timeout=180s

      - name: Check Application
        run: |
          kubectl get pods -n cloud-task-manager
          kubectl get services -n cloud-task-manager

      - name: Stop Existing Application Port Forward
        run: |
          pkill -f "kubectl port-forward.*service/task-manager.*5000:5000" || true

      - name: Port Forward Application
        run: |
          nohup kubectl port-forward \
            service/task-manager \
            5000:5000 \
            -n cloud-task-manager \
            --address=0.0.0.0 \
            > /tmp/task-manager-port-forward.log 2>&1 &

          sleep 5

      - name: Verify Application
        run: |
          cat /tmp/task-manager-port-forward.log
          curl -f http://localhost:5000

      - name: Verify Metrics
        run: |
          curl -f http://localhost:5000/metrics

      - name: Deploy Prometheus
        run: |
          kubectl apply \
            -f k8s/prometheus.yml \
            -n cloud-task-manager

      - name: Wait for Prometheus
        run: |
          kubectl rollout status deployment/prometheus \
            -n cloud-task-manager \
            --timeout=180s

      - name: Check Prometheus
        run: |
          kubectl get pods -n cloud-task-manager
          kubectl get services -n cloud-task-manager

      - name: Stop Existing Prometheus Port Forward
        run: |
          pkill -f "kubectl port-forward.*service/prometheus.*9090:9090" || true

      - name: Port Forward Prometheus
        run: |
          nohup kubectl port-forward \
            service/prometheus \
            9090:9090 \
            -n cloud-task-manager \
            --address=0.0.0.0 \
            > /tmp/prometheus.log 2>&1 &

          sleep 5

      - name: Verify Prometheus
        run: |
          cat /tmp/prometheus.log
          curl -f http://localhost:9090/-/ready

      - name: Verify Prometheus Target
        run: |
          curl -s http://localhost:9090/api/v1/targets